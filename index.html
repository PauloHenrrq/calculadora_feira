<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Calculadora simples para feira — calcule preços com margem do mercadinho">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Feira Calc">
  <title>Feira Calc</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-top">
      <div class="app-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="logo-text">Feira Calc</span>
      </div>
    </div>
    
    <!-- Margem Config -->
    <div class="markup-bar">
      <span class="markup-label">Acréscimo do Mercadinho</span>
      <div class="markup-control">
        <button class="markup-btn" id="markupMinus" aria-label="Diminuir margem">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="btn-svg"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <div class="markup-display">
          <input type="number" id="markupInput" value="40" min="0" max="300" step="5" inputmode="numeric">
          <span class="markup-symbol">%</span>
        </div>
        <button class="markup-btn" id="markupPlus" aria-label="Aumentar margem">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="btn-svg"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Navegação por Abas (Tab Bar Superior) -->
    <nav class="tab-nav">
      <button class="tab-button active" data-tab="list">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34M12 2v15"/></svg>
        <span>Ver Lista</span>
      </button>
      <button class="tab-button" data-tab="add">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Novo Item</span>
      </button>
      <button class="tab-button" data-tab="history">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tab-icon"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Histórico</span>
      </button>
    </nav>
  </header>

  <!-- Main Views Container -->
  <main class="main">

    <!-- ABA 1: Ver Lista -->
    <div id="tab-view-list" class="tab-content">
      <div class="search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="search-svg"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar produtos na lista...">
        <button class="search-clear hidden" id="searchClear" aria-label="Limpar busca">✕</button>
      </div>

      <section class="list-section">
        <div class="list-header">
          <span class="list-title">Produtos Adicionados</span>
          <span class="badge" id="itemCount">0 itens</span>
        </div>
        
        <div id="itemsList" class="items-list"></div>

        <div id="emptyState" class="empty-state">
          <div class="empty-illustration">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-svg-illustration"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          </div>
          <p class="empty-title">Nenhum produto na lista</p>
          <p class="empty-sub">Toque em <strong>"Novo Item"</strong> no topo para adicionar</p>
        </div>
      </section>
    </div>

    <!-- ABA 2: Adicionar Novo Item -->
    <div id="tab-view-add" class="tab-content hidden">
      <section class="card add-card">
        <h2 class="card-title">Inserir novo produto</h2>
        <form id="addItemForm" autocomplete="off">
          <div class="form-group">
            <label for="itemName" class="form-label">Nome do Produto</label>
            <input type="text" id="itemName" class="form-input" placeholder="Ex: Banana, Maçã, Tomate..." required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="itemPrice" class="form-label">Preço do Kilo (R$)</label>
              <div class="input-prefix">
                <span>R$</span>
                <input type="text" id="itemPrice" class="form-input" inputmode="decimal" placeholder="0,00" required>
              </div>
            </div>
            
            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label for="itemQty" class="form-label" style="margin-bottom: 0;">Peso</label>
                <div class="unit-selector" id="addUnitSelector">
                  <button type="button" class="unit-option active" data-unit="kg">KG</button>
                  <button type="button" class="unit-option" data-unit="g">g</button>
                </div>
              </div>
              <input type="text" id="itemQty" class="form-input" inputmode="decimal" placeholder="0,00" required>
            </div>
          </div>

          <button type="submit" class="btn btn-add" id="btnAdd">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-add-svg"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Confirmar e Adicionar</span>
          </button>
        </form>
      </section>
    </div>

    <!-- ABA 3: Histórico de Listas -->
    <div id="tab-view-history" class="tab-content hidden">
      <section class="list-section">
        <div class="list-header">
          <span class="list-title">Minhas Compras Anteriores</span>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>

  </main>

  <!-- Sticky Footer Bar (Sempre visível para Lista, mostra o Total Geral) -->
  <footer class="total-bar" id="totalBar">
    <div class="total-main" style="display: flex; justify-content: space-between; gap: 16px; width: 100%;">
      <div>
        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Total a Pagar (Custo)</div>
        <div class="total-value" id="totalValue" style="font-size: 1.45rem; font-weight: 800; color: var(--text-secondary);">R$ 0,00</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Lucro Projetado</div>
        <div class="total-value" id="totalProfit" style="font-size: 1.55rem; font-weight: 800; color: var(--green);">R$ 0,00</div>
      </div>
    </div>
    
    <div class="total-actions">
      <button class="action-btn" id="btnShare" title="Enviar lista por WhatsApp">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-svg"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v16"/></svg>
        <span class="action-text">WhatsApp</span>
      </button>
      <button class="action-btn accent-green" id="btnSave" title="Salvar Lista no Histórico">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-svg"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span class="action-text">Salvar</span>
      </button>
      <button class="action-btn accent-red" id="btnClear" title="Apagar todos os itens">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-svg"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        <span class="action-text">Limpar</span>
      </button>
    </div>
  </footer>

  <!-- Modal de Confirmação (Destrutivo) -->
  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="confirmTitle">Confirmar</h2>
      </div>
      <div class="modal-body">
        <p id="confirmMessage"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel">Voltar</button>
        <button class="btn btn-danger" id="confirmOk">Apagar</button>
      </div>
    </div>
  </div>

  <!-- Modal de Edição de Item -->
  <div class="modal-overlay hidden" id="editModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Editar Item</h2>
      </div>
      <form id="editForm" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <div class="form-group" style="text-align: left;">
          <label class="form-label">Nome do Produto</label>
          <input type="text" id="editItemName" class="form-input" disabled style="opacity: 0.7; background: var(--bg-input);" />
        </div>
        <div class="form-row" style="text-align: left;">
          <div class="form-group">
            <label for="editItemPrice" class="form-label">Preço do Kilo (R$)</label>
            <div class="input-prefix">
              <span>R$</span>
              <input type="text" id="editItemPrice" class="form-input" inputmode="decimal" required />
            </div>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label for="editItemQty" class="form-label" style="margin-bottom: 0;">Peso</label>
              <div class="unit-selector" id="editUnitSelector">
                <button type="button" class="unit-option active" data-unit="kg">KG</button>
                <button type="button" class="unit-option" data-unit="g">g</button>
              </div>
            </div>
            <input type="text" id="editItemQty" class="form-input" inputmode="decimal" required />
          </div>
        </div>
        <div class="modal-actions" style="margin-top: 16px;">
          <button type="button" class="btn btn-ghost" id="editModalCancel" style="padding: 12px;">Voltar</button>
          <button type="submit" class="btn btn-add" id="editModalSave" style="padding: 12px;">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast de Notificação Rápida -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
